name: Build

# Builds and checks all three versions on every push. Pushing a tag like v1.0.0 also publishes a release
# with the three downloads attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    name: Mac (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        working-directory: swift
        run: bash run-checks.sh
      - name: Build Corner.app
        working-directory: swift
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Mac-Swift
          path: swift/out/Corner-Mac-Swift.zip

  avalonia:
    name: Mac (Avalonia)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks
        working-directory: mac-avalonia
        run: bash run-tests.sh
      - name: Publish and package
        working-directory: mac-avalonia
        run: |
          pip install pillow
          for r in osx-arm64 osx-x64; do
            dotnet publish Corner.Mac/Corner.Mac.csproj -c Release -r $r --self-contained true -o out/publish-$r
          done
          python tools/package.py
      - name: Starts on a Mac
        working-directory: mac-avalonia
        run: |
          rm -rf /tmp/av && mkdir /tmp/av && cd /tmp/av && unzip -q $GITHUB_WORKSPACE/mac-avalonia/out/Corner-Mac-AppleSilicon.zip
          export CORNER_DATA=/tmp/av-data && mkdir -p $CORNER_DATA
          ./Corner.app/Contents/MacOS/Corner --demo /tmp/av/demo.png all & pid=$!
          for i in $(seq 1 60); do [ -f /tmp/av/demo.png ] && break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la /tmp/av/demo.png
          cat $CORNER_DATA/error.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Mac-Avalonia
          path: |
            mac-avalonia/out/Corner-Mac-AppleSilicon.zip
            mac-avalonia/out/Corner-Mac-Intel.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Corner.exe
        working-directory: windows
        shell: pwsh
        run: ./build.ps1
      - name: Checks
        working-directory: windows
        shell: pwsh
        run: ./tests/run.ps1
      - name: Zip
        shell: pwsh
        run: |
          $d = 'out/Corner-Windows'; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item windows/Corner.exe, windows/ping.wav, windows/Gilroy-*.ttf, 'windows/READ ME FIRST.txt' $d
          Compress-Archive -Path $d -DestinationPath out/Corner-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Windows
          path: out/Corner-Windows.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [swift, avalonia, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dl/*.zip --repo "$GITHUB_REPOSITORY" --title "Corner $GITHUB_REF_NAME" \
            --notes "Downloads: Corner-Windows.zip (Windows 10/11), Corner-Mac-Swift.zip (Mac, native, recommended), Corner-Mac-AppleSilicon.zip / Corner-Mac-Intel.zip (Mac, Avalonia). See the README for how to open them the first time."
