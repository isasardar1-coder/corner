name: Build

# Builds and checks both versions on every push. Pushing a tag like v1.1.0 also publishes a release
# with the two downloads attached and RELEASE_NOTES.md as its text.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    name: Mac (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        working-directory: swift
        run: bash run-checks.sh
      - name: Build Corner.app
        working-directory: swift
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*) export CORNER_VERSION="${GITHUB_REF_NAME#v}";; esac
          DEMOS=0 bash package.sh
          for r in 0 1; do for m in rest resttimeup tasks; do d=$(mktemp -d); echo "== real=$r $m"; CORNER_DATA=$d PROBE_REAL=$r out/Corner.app/Contents/MacOS/Corner --demo $PWD/out/demo-$m-r$r.png $m & p=$!; for i in $(seq 30); do kill -0 $p 2>/dev/null || break; sleep 1; done; kill $p 2>/dev/null || true; wait $p || true; cat $d/error.log || true; done; done
      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Mac-Swift
          path: swift/out/Corner-Mac-Swift.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Swift-demo-renders
          path: swift/out/demo-*.png

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Corner.exe
        working-directory: windows
        shell: pwsh
        run: ./build.ps1
      - name: Checks
        working-directory: windows
        shell: pwsh
        run: ./tests/run.ps1
      - name: Zip
        shell: pwsh
        run: |
          $d = 'out/Corner-Windows'; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item windows/Corner.exe, windows/ping.wav, windows/Gilroy-*.ttf, 'windows/READ ME FIRST.txt' $d
          Compress-Archive -Path $d -DestinationPath out/Corner-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Windows
          path: out/Corner-Windows.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [swift, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: Corner-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dl/*.zip --repo "$GITHUB_REPOSITORY" --title "Corner $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
